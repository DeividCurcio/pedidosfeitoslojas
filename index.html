<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="Painel simples para acompanhar os pedidos da sua loja.">
  <title>Pedidos da loja</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f6f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #687386;
      --line: #e7eaf0;
      --primary: #5b55e7;
      --surface: #fff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 38px 0 56px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 30px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { display: grid; place-items: center; width: 44px; height: 44px; color: #fff; background: var(--primary); border-radius: 14px; font-size: 21px; }
    h1 { margin: 0; font-size: clamp(1.45rem, 3vw, 2rem); letter-spacing: -.04em; }
    .subtitle { margin: 5px 0 0; color: var(--muted); font-size: .94rem; }
    .badge { color: #4d48ca; background: #eeedff; padding: 9px 13px; border-radius: 999px; font-size: .82rem; font-weight: 650; white-space: nowrap; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 22px; }
    .card, .orders { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 5px 20px #202a4408; }
    .stat { padding: 19px 21px; }
    .stat-label { color: var(--muted); font-size: .86rem; }
    .stat-value { display: block; margin-top: 8px; font-size: 1.65rem; font-weight: 730; letter-spacing: -.04em; }
    .orders { overflow: hidden; }
    .orders-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 22px; border-bottom: 1px solid var(--line); }
    h2 { margin: 0; font-size: 1.1rem; }
    .tools { display: flex; align-items: center; gap: 10px; }
    select, input { min-height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; color: #273248; background: #fff; }
    .primary { min-height: 42px; border: 0; border-radius: 10px; padding: 0 15px; color: #fff; background: var(--primary); font-weight: 650; }
    .primary:hover { background: #4943ce; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 15px 22px; border-bottom: 1px solid #f0f1f5; white-space: nowrap; }
    th { color: var(--muted); font-size: .78rem; font-weight: 650; text-transform: uppercase; letter-spacing: .045em; }
    td { font-size: .91rem; }
    tbody tr:last-child td { border-bottom: 0; }
    .customer { font-weight: 650; }
    .order-id { color: var(--muted); font-size: .82rem; }
    .status { display: inline-flex; align-items: center; gap: 7px; padding: 6px 9px; border-radius: 999px; font-size: .78rem; font-weight: 650; }
    .status::before { content: ""; width: 7px; height: 7px; background: currentColor; border-radius: 50%; }
    .status-pendente { color: #9a6500; background: #fff5d9; }
    .status-processando { color: #3c55bd; background: #edf1ff; }
    .status-enviado { color: #16794c; background: #e7f7ee; }
    .empty { padding: 48px 20px; text-align: center; color: var(--muted); }
    .empty strong { display: block; color: #273248; margin-bottom: 6px; }
    .delete { border: 0; color: #a34444; background: transparent; padding: 6px; }
    dialog { width: min(460px, calc(100% - 28px)); border: 1px solid var(--line); border-radius: 18px; padding: 0; box-shadow: 0 24px 80px #11182733; }
    dialog::backdrop { background: #17203366; }
    .dialog-inner { padding: 23px; }
    .dialog-inner h2 { margin-bottom: 18px; }
    .field { display: grid; gap: 7px; margin-bottom: 14px; }
    .field label { font-size: .85rem; font-weight: 600; }
    .field input, .field select { width: 100%; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
    .secondary { min-height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; background: #fff; }
    @media (max-width: 680px) {
      .shell { width: min(100% - 28px, 560px); padding-top: 24px; }
      header { align-items: flex-start; }
      .badge { display: none; }
      .stats { grid-template-columns: 1fr; gap: 10px; }
      .stat { display: flex; align-items: center; justify-content: space-between; padding: 15px 17px; }
      .stat-value { margin: 0; font-size: 1.35rem; }
      .orders-top { align-items: stretch; flex-direction: column; padding: 17px; }
      .tools { width: 100%; }
      .tools select { flex: 1; min-width: 0; }
      th, td { padding: 13px 15px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      button, select { transition: background-color .15s ease, border-color .15s ease; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">▣</div>
        <div>
          <h1>Pedidos da loja</h1>
          <p class="subtitle">Acompanhe e organize seus pedidos.</p>
        </div>
      </div>
      <span class="badge">Painel da loja</span>
    </header>

    <section class="stats" aria-label="Resumo dos pedidos">
      <article class="card stat"><span class="stat-label">Total de pedidos</span><strong class="stat-value" id="total">0</strong></article>
      <article class="card stat"><span class="stat-label">Aguardando</span><strong class="stat-value" id="pending">0</strong></article>
      <article class="card stat"><span class="stat-label">Vendas registradas</span><strong class="stat-value" id="sales">R$ 0,00</strong></article>
    </section>

    <section class="orders" aria-labelledby="orders-title">
      <div class="orders-top">
        <h2 id="orders-title">Seus pedidos</h2>
        <div class="tools">
          <label for="filter" class="visually-hidden">Filtrar pedidos</label>
          <select id="filter" aria-label="Filtrar pedidos">
            <option value="todos">Todos os status</option>
            <option value="Pendente">Pendente</option>
            <option value="Processando">Processando</option>
            <option value="Enviado">Enviado</option>
          </select>
          <button class="primary" id="add-order" type="button">+ Novo pedido</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Cliente</th><th>Pedido</th><th>Data</th><th>Valor</th><th>Status</th><th><span class="visually-hidden">Ações</span></th></tr></thead>
          <tbody id="order-list"></tbody>
        </table>
        <div class="empty" id="empty-state"><strong>Nenhum pedido por aqui ainda</strong>Adicione seu primeiro pedido para começar.</div>
      </div>
    </section>
  </main>

  <dialog id="order-dialog" aria-labelledby="dialog-title">
    <form class="dialog-inner" id="order-form">
      <h2 id="dialog-title">Adicionar pedido</h2>
      <div class="field"><label for="customer">Nome do cliente</label><input id="customer" name="customer" required maxlength="80" autocomplete="name"></div>
      <div class="field"><label for="amount">Valor (R$)</label><input id="amount" name="amount" type="number" required min="0.01" step="0.01" inputmode="decimal"></div>
      <div class="field"><label for="status">Status</label><select id="status" name="status"><option>Pendente</option><option>Processando</option><option>Enviado</option></select></div>
      <div class="dialog-actions"><button class="secondary" type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Salvar pedido</button></div>
    </form>
  </dialog>

  <script>
    (() => {
      const STORAGE_KEY = 'pedidosfeitoslojas-pedidos-v1';
      const list = document.querySelector('#order-list');
      const emptyState = document.querySelector('#empty-state');
      const dialog = document.querySelector('#order-dialog');
      const form = document.querySelector('#order-form');
      const filter = document.querySelector('#filter');
      const money = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
      let orders = loadOrders();

      function loadOrders() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          return Array.isArray(saved) ? saved.filter(order => order && typeof order.customer === 'string' && Number.isFinite(Number(order.amount))) : [];
        } catch {
          return [];
        }
      }

      function persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
        } catch {
          window.alert('Não foi possível salvar neste navegador. Verifique o espaço disponível ou as configurações de privacidade.');
        }
      }

      function render() {
        const visibleOrders = filter.value === 'todos' ? orders : orders.filter(order => order.status === filter.value);
        list.replaceChildren();
        emptyState.hidden = visibleOrders.length > 0;
        document.querySelector('#total').textContent = String(orders.length);
        document.querySelector('#pending').textContent = String(orders.filter(order => order.status === 'Pendente').length);
        document.querySelector('#sales').textContent = money.format(orders.reduce((sum, order) => sum + Number(order.amount), 0));

        for (const order of visibleOrders) {
          const row = document.createElement('tr');
          const customerCell = document.createElement('td');
          const name = document.createElement('span');
          name.className = 'customer';
          name.textContent = order.customer;
          customerCell.append(name);
          const idCell = document.createElement('td');
          idCell.className = 'order-id';
          idCell.textContent = `#${order.id}`;
          const dateCell = document.createElement('td');
          dateCell.textContent = order.date;
          const amountCell = document.createElement('td');
          amountCell.textContent = money.format(Number(order.amount));
          const statusCell = document.createElement('td');
          const status = document.createElement('span');
          status.className = `status status-${order.status.toLowerCase()}`;
          status.textContent = order.status;
          statusCell.append(status);
          const actionCell = document.createElement('td');
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'delete';
          remove.textContent = 'Excluir';
          remove.setAttribute('aria-label', `Excluir pedido de ${order.customer}`);
          remove.addEventListener('click', () => {
            orders = orders.filter(item => item.id !== order.id);
            persist();
            render();
          });
          actionCell.append(remove);
          row.append(customerCell, idCell, dateCell, amountCell, statusCell, actionCell);
          list.append(row);
        }
      }

      document.querySelector('#add-order').addEventListener('click', () => dialog.showModal());
      document.querySelector('#cancel').addEventListener('click', () => dialog.close());
      dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
      filter.addEventListener('change', render);
      form.addEventListener('submit', event => {
        event.preventDefault();
        const data = new FormData(form);
        orders.unshift({
          id: Date.now().toString().slice(-6),
          customer: String(data.get('customer')).trim(),
          amount: Number(data.get('amount')),
          status: String(data.get('status')),
          date: new Intl.DateTimeFormat('pt-BR').format(new Date())
        });
        persist();
        form.reset();
        dialog.close();
        filter.value = 'todos';
        render();
      });
      render();
    })();
  </script>
  <style>.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }</style>
</body>
</html>
